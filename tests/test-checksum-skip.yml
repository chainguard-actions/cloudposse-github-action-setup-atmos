name: Test atmos installation with checksum validation skipped
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: latest
          install-wrapper: "true"
          checksum-validation: skip
      - name: Assert atmos-version output is set
        env:
          ATMOS_VERSION: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "atmos-version: $ATMOS_VERSION"
          if [ -z "$ATMOS_VERSION" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version is '$ATMOS_VERSION'"
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos >/dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos runs successfully
        run: |
          atmos version
          echo "PASS: atmos version ran successfully with checksum-validation=skip"
