name: Test checksum-validation skip
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: 1.100.0
          install-wrapper: "false"
          checksum-validation: skip
      - name: Assert install succeeded
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "v1.100.0" ]; then
            echo "FAIL: expected 'v1.100.0'"
            exit 1
          fi
          command -v atmos || { echo "FAIL: atmos not on PATH"; exit 1; }
          echo "PASS"
