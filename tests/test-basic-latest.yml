name: Test basic latest install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
      - name: Assert atmos-version output looks like a version
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "FAIL: expected a vX.Y.Z version"
            exit 1
          fi
          echo "PASS"
      - name: Assert wrapper installed
        run: |
          echo "ATMOS_CLI_PATH=$ATMOS_CLI_PATH"
          if [ -z "$ATMOS_CLI_PATH" ]; then
            echo "FAIL: ATMOS_CLI_PATH not exported"
            exit 1
          fi
          if [ ! -x "$ATMOS_CLI_PATH/atmos-bin" ]; then
            echo "FAIL: atmos-bin missing"
            exit 1
          fi
          if [ ! -x "$ATMOS_CLI_PATH/atmos" ]; then
            echo "FAIL: atmos wrapper missing"
            exit 1
          fi
          which atmos
          echo "PASS"
      - name: Assert native binary reports installed version
        env:
          VERSION: ${{ steps.action.outputs.atmos-version }}
        run: |
          cd "$RUNNER_TEMP"
          OUT="$("$ATMOS_CLI_PATH/atmos-bin" version 2>&1 || true)"
          echo "$OUT"
          V="${VERSION#v}"
          if ! echo "$OUT" | grep -qF "$V"; then
            echo "FAIL: expected version $V in output"
            exit 1
          fi
          echo "PASS"
