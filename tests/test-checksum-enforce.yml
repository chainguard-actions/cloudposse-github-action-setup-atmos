name: Test checksum validation enforce
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: "latest"
          install-wrapper: "true"
          checksum-validation: "enforce"
          token: ${{ github.token }}
      - name: Assert atmos-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version=$ACTUAL"
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos >/dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos runs successfully with enforced checksum
        run: |
          VERSION_OUTPUT=$(atmos version 2>&1 || true)
          echo "atmos version output: $VERSION_OUTPUT"
          if [ -z "$VERSION_OUTPUT" ]; then
            echo "FAIL: atmos version produced no output"
            exit 1
          fi
          echo "PASS: atmos version ran successfully with checksum-validation=enforce"
