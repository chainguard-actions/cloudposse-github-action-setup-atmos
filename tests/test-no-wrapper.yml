name: Test atmos installation without wrapper
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: latest
          install-wrapper: "false"
          checksum-validation: warn
      - name: Assert atmos-version output is set
        env:
          ATMOS_VERSION: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "atmos-version: $ATMOS_VERSION"
          if [ -z "$ATMOS_VERSION" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version is '$ATMOS_VERSION'"
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos >/dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos runs without wrapper
        run: |
          # Without wrapper, atmos should run directly and produce output
          OUTPUT=$(atmos version 2>&1 || true)
          echo "atmos version output: $OUTPUT"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: atmos version produced no output"
            exit 1
          fi
          echo "PASS: atmos runs without wrapper"
