name: Test installation without wrapper script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: "latest"
          install-wrapper: "false"
          checksum-validation: "warn"
      - name: Assert atmos-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version=$ACTUAL"
      - name: Assert atmos binary is available
        run: |
          which atmos || { echo "FAIL: atmos binary not found in PATH"; exit 1; }
          echo "PASS: atmos found at $(which atmos)"
      - name: Assert atmos runs without wrapper
        run: |
          atmos version || { echo "FAIL: atmos version command failed"; exit 1; }
          echo "PASS: atmos runs successfully without wrapper"
      - name: Assert binary is not a wrapper script
        run: |
          ATMOS_PATH=$(which atmos)
          echo "atmos path: $ATMOS_PATH"
          # Without wrapper, the binary should be an ELF executable, not a shell script
          FILE_TYPE=$(file "$ATMOS_PATH" 2>&1 || true)
          echo "file type: $FILE_TYPE"
          if echo "$FILE_TYPE" | grep -qi "shell script"; then
            echo "FAIL: atmos appears to be a wrapper shell script when install-wrapper=false"
            exit 1
          fi
          echo "PASS: atmos is not a wrapper shell script"
