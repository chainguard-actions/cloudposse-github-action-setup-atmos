name: Test installation without wrapper script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: "latest"
          install-wrapper: "false"
          checksum-validation: "skip"
      - name: Assert atmos-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version=$ACTUAL"
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos > /dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos binary is the real binary (not wrapper)
        run: |
          ATMOS_PATH=$(command -v atmos)
          echo "atmos path: $ATMOS_PATH"
          # When install-wrapper is false, the binary should be the real atmos binary (ELF)
          # The wrapper script is a Node.js script with #!/usr/bin/env node shebang
          # Check the first few bytes to distinguish ELF from script
          FIRST_BYTES=$(head -c 4 "$ATMOS_PATH" | xxd -p 2>/dev/null || od -A n -N 4 -t x1 "$ATMOS_PATH" | tr -d ' ')
          echo "first bytes (hex): $FIRST_BYTES"
          # ELF magic number is 7f454c46 (0x7f E L F)
          if echo "$FIRST_BYTES" | grep -qi "7f454c46"; then
            echo "PASS: atmos is a real ELF binary (not a wrapper script)"
          else
            # Also check if it's NOT a node script (which would indicate wrapper was installed)
            FIRST_LINE=$(head -1 "$ATMOS_PATH" 2>/dev/null || true)
            echo "first line: $FIRST_LINE"
            if echo "$FIRST_LINE" | grep -q "node"; then
              echo "FAIL: expected real binary but found Node.js wrapper script"
              exit 1
            fi
            echo "PASS: atmos does not appear to be a Node.js wrapper"
          fi
      - name: Assert atmos runs successfully without wrapper
        run: |
          atmos version 2>&1 || true
          echo "PASS: atmos version command completed"
