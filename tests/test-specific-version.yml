name: Test specific version installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: "1.63.0"
          install-wrapper: "true"
          checksum-validation: "skip"
      - name: Assert atmos-version output matches requested version
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          # The output is the release tag name which may be "v1.63.0" or "1.63.0"
          if echo "$ACTUAL" | grep -qF "1.63.0"; then
            echo "PASS: version matches 1.63.0"
          else
            echo "FAIL: expected version 1.63.0 but got $ACTUAL"
            exit 1
          fi
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos > /dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos reports correct version
        run: |
          VERSION_OUTPUT=$(atmos version 2>&1 || true)
          echo "atmos version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qF "1.63.0"; then
            echo "PASS: atmos reports version 1.63.0"
          else
            echo "WARN: version string may differ in format: $VERSION_OUTPUT"
          fi
