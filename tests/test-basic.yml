name: Test basic usage (latest atmos)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup
        uses: .
        with:
          atmos-version: latest
          install-wrapper: "true"
          checksum-validation: skip
      - name: Assert atmos-version output is set
        env:
          ACTUAL: ${{ steps.setup.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version=$ACTUAL"
      - name: Assert atmos binary is available
        run: |
          which atmos || { echo "FAIL: atmos binary not found in PATH"; exit 1; }
          echo "PASS: atmos found at $(which atmos)"
      - name: Assert atmos runs successfully
        run: |
          atmos version || { echo "FAIL: atmos version command failed"; exit 1; }
          echo "PASS"
