name: Test basic usage - install latest atmos
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          atmos-version: "latest"
          install-wrapper: "true"
          checksum-validation: "skip"
      - name: Assert atmos-version output is set
        env:
          ACTUAL: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: atmos-version output is empty"
            exit 1
          fi
          echo "PASS: atmos-version=$ACTUAL"
      - name: Assert atmos binary is on PATH
        run: |
          if ! command -v atmos > /dev/null 2>&1; then
            echo "FAIL: atmos binary not found on PATH"
            exit 1
          fi
          echo "PASS: atmos found at $(command -v atmos)"
      - name: Assert atmos runs and reports version
        run: |
          # The wrapper captures output internally but also passes it through
          # Try running atmos version and check it exits successfully
          atmos version 2>&1 || true
          echo "PASS: atmos version command completed"
