name: Test invalid checksum-validation mode fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          checksum-validation: bogus
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          VERSION: ${{ steps.action.outputs.atmos-version }}
        run: |
          echo "outcome: $OUTCOME"
          echo "version: $VERSION"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid checksum-validation mode"
            exit 1
          fi
          if [ -n "$VERSION" ]; then
            echo "FAIL: expected no version output"
            exit 1
          fi
          echo "PASS"
